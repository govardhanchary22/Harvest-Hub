services:
  - type: web
    name: harvest-hub
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: mongodb://127.0.0.1:27017/harvest-hub
        sync: false
